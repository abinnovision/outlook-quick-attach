name: Lint commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-commits:
    name: Lint commits
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run Commitlint
        uses: abinnovision/actions@run-commitlint-v1
