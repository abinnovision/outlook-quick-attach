name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.event.merge_group.id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions: {}

jobs:
  ci:
    name: CI
    uses: abinnovision/actions/.github/workflows/workflow.yaml@app-stack-v2
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write

  msi:
    name: MSI
    needs: ci
    # Releases upload a stable MSI to the GitHub release; every other run uploads a dev MSI as a workflow artifact.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write # gh release upload
      id-token: write # attestation signing
      attestations: write
    env:
      RELEASES: ${{ needs.ci.outputs.releases }}
      SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve release
        id: release
        run: |
          $release = if ($env:RELEASES) { $env:RELEASES | ConvertFrom-Json | Where-Object { $_.id -eq 'outlook-quick-attach' } | Select-Object -First 1 }
          if ($release) {
            "version=$($release.version)" >> $env:GITHUB_OUTPUT
            "tag=$($release.tag)" >> $env:GITHUB_OUTPUT
            "ref=$($release.releaseSha)" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Resolve version
        id: version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Dev builds: <package.json version>.<run number>, e.g. 0.1.0.57.
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { "$((Get-Content package.json -Raw | ConvertFrom-Json).version).$env:GITHUB_RUN_NUMBER" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$env:TAG" >> $env:GITHUB_OUTPUT

      - name: Read dotnet version
        id: dotnet
        run: |
          $version = (Select-String -Path .tool-versions -Pattern '^dotnet\s+(\S+)').Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.dotnet.outputs.version }}

      - name: Build add-in and updater
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build src/QuickAttach/QuickAttach.csproj -c Release -p:Version=$env:VERSION
          dotnet build src/QuickAttach.Updater/QuickAttach.Updater.csproj -c Release -p:Version=$env:VERSION

      - name: Prepare signing
        if: env.SIGNING_CERT_PFX != ''
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX))
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV

      - name: Sign binaries
        if: env.SIGNING_CERT_PFX != ''
        run: |
          & $env:SIGNTOOL sign /f $env:SIGNING_PFX /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            src/QuickAttach/bin/Release/net48/QuickAttach.dll `
            src/QuickAttach/bin/Release/net48/QuickAttach.Core.dll `
            src/QuickAttach.Updater/bin/Release/net48/QuickAttach.Updater.exe

      - name: Build MSI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build installer/QuickAttach.Installer.wixproj -c Release -p:Version=$env:VERSION -p:BuildProjectReferences=false
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem installer/bin -Recurse -Filter QuickAttach.msi | Select-Object -First 1 | Copy-Item -Destination out/QuickAttach.msi

      - name: Sign MSI
        if: env.SIGNING_CERT_PFX != ''
        run: |
          & $env:SIGNTOOL sign /f $env:SIGNING_PFX /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 out/QuickAttach.msi
          Remove-Item $env:SIGNING_PFX

      - name: Write checksums
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $files = @('QuickAttach.msi')
          if ($env:TAG) {
            Copy-Item deploy/config.example.json, deploy/install.cmd -Destination out
            $files += 'config.example.json', 'install.cmd'
          }
          $lines = $files | ForEach-Object { "$((Get-FileHash "out/$_" -Algorithm SHA256).Hash.ToLowerInvariant())  $_" }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS", (($lines -join "`n") + "`n"))
          "### SHA256 checksums`n``````text`n$($lines -join "`n")`n``````" >> $env:GITHUB_STEP_SUMMARY

      - name: Attest build provenance
        if: github.event.pull_request.head.repo.fork != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS

      - name: Upload artifact
        if: steps.version.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: QuickAttach-${{ steps.version.outputs.version }}
          path: |
            out/QuickAttach.msi
            out/SHA256SUMS
          if-no-files-found: error

      - name: Upload release assets
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload $env:TAG out/QuickAttach.msi out/config.example.json out/install.cmd out/SHA256SUMS --clobber
